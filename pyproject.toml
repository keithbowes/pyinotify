[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyinotify"
dynamic = ["version"]
description = "Linux filesystem events monitoring"
authors = [
    {name = "Sebastien Martini", email = "seb@dbzteam.org"}
]
license = "MIT"
license-files = ["COPYING"]
readme = "README.md"
requires-python = ">= 3.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: BSD :: OpenBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
    ]

[project.scripts]
pyinotify = "pyinotify:command_line"

[project.urls]
Homepage = "https://github.com/lexdene/pyinotify"
"API Documentation" = "https://seb.dbzteam.org/pyinotify/"
Wiki = "https://github.com/seb-m/pyinotify/wiki"

[tool.setuptools]
packages = ["pyinotify", "pyinotify.examples"]
platforms = ["FreeBSD", "Linux", "MacOSX", "OpenBSD"]

[tool.setuptools.dynamic]
version = {attr = "python3.pyinotify.__version__"}

[tool.setuptools.package-dir]
pyinotify = "python3"
python3 = "python3"
