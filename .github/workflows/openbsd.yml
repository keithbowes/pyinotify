# Test installation on OpenBSD.
name: openbsd

on: [push, pull_request]

jobs:
  test-openbsd:
    name: Test on OpenBSD
    env:
      LD_LIBRARY_PATH: "/usr/local/lib/inotify:$LD_LIBRARY_PATH"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: run-tests
        uses: vmactions/openbsd-vm@v1
        with:
          envs: 'LD_LIBRARY_PATH'
          usesh: true
          prepare: |
            pkg_add -I -r python libinotify
          run: |
            python3 -m venv $(pwd)/venv
            . $(pwd)/venv/bin/activate
            make deps
            make test
            deactivate
