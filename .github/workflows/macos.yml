# Test installation on MacOS.
name: macOS

on: [push, pull_request]

env:
  EXTRA_CFLAGS: "-pipe"
  DYLD_LIBRARY_PATH: "/usr/local/lib:$DYLD_LIBRARY_PATH"

jobs:
  test-macos:
    name: Test on MacOS
    runs-on: macos-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c

      - name: Install dependencies
        run: |
          brew install python

      - name: Get libinotify
        run: |
          unset got_libinotify
          brew install libinotify && got_libinotify=1 || true
          if test -z "$got_libinotify";
          then
            brew install autoconf automake git libtool
            git clone --depth=1 https://github.com/libinotify-kqueue/libinotify-kqueue
            cd libinotify-kqueue
            export CFLAGS="-g -O2 -Wno-unguarded-availability-new"
            autoreconf -fvi
            ./configure
            make
            sudo make install
          fi

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Tests
        run: |
          python3 -m venv $(pwd)/venv
          . $(pwd)/venv/bin/activate
          make deps
          make test
