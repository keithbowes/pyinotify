# Test installation on Linux.
name: linux
on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        container: alpine:edge
        steps:
            - name: packages
              run: |
                apk add gcc make musl-dev python3 python3-dev
            # actions/checkout@v7 clones the repository
            - uses: actions/checkout@v7
            - name: run-tests
              run: |
                python3 -m venv $(pwd)/venv
                . $(pwd)/venv/bin/activate
                make deps
                make test
